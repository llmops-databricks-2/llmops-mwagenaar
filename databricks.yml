# Databricks Asset Bundle of llmops-mwagenaar, shaped like the course's llmops-course-code.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: llmops-mwagenaar

# The course package is built as a wheel and installed in every job environment.
artifacts:
  default:
    type: whl
    build: uv build
    path: .

variables:
  # Keep these in sync with the per-environment values in project_config.yml.
  usage_policy_id:
    description: usage policy id for serverless jobs (usage_policy_id in project_config.yml)
    default: 0476cb4f-cbf4-34bc-ab5e-133c637fe2d8
  warehouse_id:
    description: SQL warehouse for the Genie space (warehouse_id in project_config.yml)
    default: 77533c87900b022b
  catalog:
    description: Unity Catalog catalog (catalog in project_config.yml)
    default: llmops_dev
  schema:
    description: schema holding arxiv_papers (schema in project_config.yml)
    default: mwagenaar

include:
  - resources/*.yml

# Three targets in the one course workspace, each writing your schema in its own catalog
# (project_config.yml). Each is deployed under the home folder of whoever deploys it: you from your
# laptop. A deployment workflow is introduced in a later lecture. The workspace host is
# set, so `databricks bundle validate -t dev` needs no profile to find it.
targets:
  # Your sandbox. Development mode prefixes every resource with "[dev" and the deployer's name,
  # so your own deploy and the pipeline's never collide.
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  # Acceptance: deployed on every merge to main.
  acc:
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  # Production: deployed after acceptance, once you approve it.
  prd:
    workspace:
      host: https://dbc-e81ca4d2-f6bd.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
