resources:
  jobs:
    hybrid_search:
      name: job-hybrid-search-mwagenaar-${bundle.target}
      budget_policy_id: "${var.usage_policy_id}"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: execute_hybrid_search
          environment_key: default
          notebook_task:
            notebook_path: deployment_notebooks/hybrid_search.py
            base_parameters:
              env: ${bundle.target}
              genie_space_id: ${resources.genie_spaces.polderbot-space.id}
